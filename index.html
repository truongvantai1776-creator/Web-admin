<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-HUB | Quản Lý Admin</title>
    <style>
        body {
            background-color: #060913;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px;
        }
        h2 { color: #38bdf8; text-align: center; }
        .table-container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(17, 24, 39, 0.9);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }
        th { color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        td { color: #94a3b8; }
        .key-val { color: #10b981; font-family: monospace; font-weight: bold; }
        .refresh-btn {
            display: block;
            margin: 0 auto 20px auto;
            background: #38bdf8;
            color: #060913;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .refresh-btn:hover { background: #0ea5e9; }
    </style>
</head>
<body>

    <div class="table-container">
        <h2>Bảng Quản Trị Key Thiết Bị</h2>
        <button class="refresh-btn" onclick="loadAdminData()">Làm Mới Danh Sách</button>
        
        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã HWID Thiết Bị</th>
                    <th>Key Cấp Phát</th>
                    <th>Thời Gian Tạo</th>
                </tr>
            </thead>
            <tbody id="deviceTableBody">
                <tr><td colspan="4" style="text-align: center;">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const NPOINT_KEYS_URL = "https://api.npoint.io/1e1e56ce8cfde33529d9"; // Dùng chung link nPoint với trang user

        async function loadAdminData() {
            let tbody = document.getElementById("deviceTableBody");
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">Đang tải dữ liệu...</td></tr>`;

            try {
                let res = await fetch(NPOINT_KEYS_URL + "?t=" + Date.now(), { cache: "no-store" });
                let data = await res.json();
                
                if (!data || !Array.isArray(data.devices) || data.devices.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">Chưa có thiết bị nào lấy key.</td></tr>`;
                    return;
                }

                let html = "";
                data.devices.forEach((item, index) => {
                    html += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${item.hwid}</td>
                            <td class="key-val">${item.key}</td>
                            <td>${item.createdTime || 'N/A'}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ef4444;">Lỗi tải dữ liệu từ nPoint!</td></tr>`;
            }
        }

        loadAdminData();
    </script>
</body>
</html>

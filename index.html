<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-HUB | Admin Panel</title>
    <style>
        body {
            background-color: #060913;
            background-image: radial-gradient(circle at center, #0f172a 0%, #060913 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            width: 520px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .header-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .logo-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        h2 { color: #38bdf8; margin: 0; font-size: 20px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        .subtitle { color: #94a3b8; font-size: 12px; }
        
        .stats-box {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            flex: 1;
            background: #0b0f19;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #1e293b;
        }
        .stat-card span { display: block; font-size: 18px; font-weight: bold; color: #38bdf8; margin-top: 4px; }

        .history-list {
            background: #0b0f19;
            padding: 12px;
            border-radius: 10px;
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid #1e293b;
            font-family: monospace;
            font-size: 11px;
        }
        .key-item {
            background: #111827;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #38bdf8;
            border: 1px solid #1e293b;
        }
        .key-item.expired {
            border-left-color: #ef4444;
            opacity: 0.75;
        }
        .key-string { color: #7dd3fc; word-break: break-all; margin: 4px 0; }
        .badge { font-weight: bold; }
        .badge-active { color: #10b981; }
        .badge-expired { color: #ef4444; }

        .action-group {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .action-group button {
            flex: 1;
            padding: 6px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-add { background: #10b981; color: white; }
        .btn-add:hover { background: #059669; }
        .btn-sub { background: #ef4444; color: white; }
        .btn-sub:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <img src="logo.png" alt="T-HUB Logo" class="logo-img" onerror="this.src='https://i.imgur.com/6X93ZgV.png'">
            <div>
                <h2>T-HUB Admin Panel</h2>
                <div class="subtitle">Quản lý và kiểm soát thời gian thiết bị (Cloud)</div>
            </div>
        </div>
        
        <div class="stats-box">
            <div class="stat-card">
                Tổng Thiết Bị
                <span id="totalKeys">0</span>
            </div>
            <div class="stat-card">
                Đang Hoạt Động
                <span id="activeKeys" style="color: #10b981;">0</span>
            </div>
        </div>

        <div class="history-list" id="adminHistoryList">Đang tải dữ liệu từ Cloud...</div>
    </div>

    <script>
        const NPOINT_API_URL = "https://api.npoint.io/df2d5d0fda1ea4e5a0fa";

        async function loadAdminData() {
            let listContainer = document.getElementById("adminHistoryList");
            let now = Date.now(); // Sử dụng Millisecond đồng bộ với trang Client

            try {
                let response = await fetch(NPOINT_API_URL, { cache: "no-store" });
                let data = await response.json();
                let users = data.users || [];

                if (users.length === 0) {
                    listContainer.innerHTML = "<div style='text-align:center; color:#64748b; padding: 20px;'>Chưa có thiết bị nào kích hoạt trên hệ thống.</div>";
                    document.getElementById("totalKeys").innerText = "0";
                    document.getElementById("activeKeys").innerText = "0";
                    return;
                }

                let activeCount = 0;
                let html = "";

                users.slice().reverse().forEach((item, index) => {
                    let expireTime = Number(item.expireTimestamp);
                    let timeLeft = expireTime - now;
                    let isExpired = timeLeft <= 0;
                    
                    if (!isExpired) activeCount++;

                    let timeStr = "";
                    if (isExpired) {
                        timeStr = "<span class='badge badge-expired'>[Đã hết hạn]</span>";
                    } else {
                        let days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                        let hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        let minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                        let seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                        
                        let textTime = "";
                        if (days > 0) textTime += days + "d ";
                        textTime += hours + "h " + minutes + "m " + seconds + "s";
                        timeStr = `<span class='badge badge-active'>Còn lại: ${textTime}</span>`;
                    }

                    let realIndex = users.length - 1 - index;

                    html += `
                        <div class="key-item ${isExpired ? 'expired' : ''}">
                            <div><b>#${users.length - index}</b> | ${timeStr}</div>
                            <div class="key-string">💻 HWID: ${item.hwid}</div>
                            <div style="color: #fbbf24; margin-bottom: 6px;">🎮 Game: ${item.gameName || 'T-HUB Script'}</div>
                            <div class="action-group">
                                <button class="btn-add" onclick="modifyTime(${realIndex}, 24)">+24 Giờ</button>
                                <button class="btn-add" onclick="modifyTime(${realIndex}, 1)">+1 Giờ</button>
                                <button class="btn-sub" onclick="modifyTime(${realIndex}, -1)">-1 Giờ</button>
                                <button class="btn-sub" onclick="modifyTime(${realIndex}, -24)">-24 Giờ</button>
                            </div>
                        </div>
                    `;
                });

                listContainer.innerHTML = html;
                document.getElementById("totalKeys").innerText = users.length;
                document.getElementById("activeKeys").innerText = activeCount;

            } catch (err) {
                listContainer.innerHTML = "<div style='text-align:center; color:#ef4444; padding: 20px;'>Lỗi kết nối tới Cloud API!</div>";
                console.error(err);
            }
        }

        // Hàm thay đổi (cộng/trừ) thời gian của máy trực tiếp trên Cloud
        async function modifyTime(userIndex, hours) {
            try {
                let response = await fetch(NPOINT_API_URL, { cache: "no-store" });
                let data = await response.json();
                
                if (!data || !Array.isArray(data.users) || !data.users[userIndex]) {
                    alert("Không tìm thấy thiết bị này trên Cloud!");
                    return;
                }

                let now = Date.now();
                let currentExpire = Number(data.users[userIndex].expireTimestamp);
                let baseTime = currentExpire > now ? currentExpire : now;
                
                let addedMs = hours * 60 * 60 * 1000;
                let newExpireTime = baseTime + addedMs;
                
                // Đảm bảo thời gian hết hạn không nhỏ hơn thời gian hiện tại nếu là trừ thời gian quá đà
                if (newExpireTime < now) {
                    newExpireTime = now;
                }

                data.users[userIndex].expireTimestamp = newExpireTime;

                // Gửi dữ liệu cập nhật lên nPoint
                let updateRes = await fetch(NPOINT_API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                if (updateRes.ok) {
                    alert(`Thành công! Đã ${hours > 0 ? 'cộng thêm' : 'trừ bớt'} ${Math.abs(hours)} giờ cho thiết bị.`);
                    loadAdminData();
                } else {
                    alert("Lỗi khi lưu dữ liệu lên Cloud!");
                }
            } catch (err) {
                console.error(err);
                alert("Đã xảy ra lỗi kết nối!");
            }
        }

        // Làm mới dữ liệu định kỳ mỗi 3 giây
        setInterval(loadAdminData, 3000);
        loadAdminData();
    </script>
</body>
</html>

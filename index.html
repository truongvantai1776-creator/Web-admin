<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-HUB | Admin Panel</title>
    <style>
        body {
            background-color: #060913;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(17, 24, 39, 0.85);
            padding: 25px;
            border-radius: 20px;
            width: 480px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h2 { color: #38bdf8; margin-top: 0; font-size: 18px; }
        .device-item {
            background: #111827;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #1e293b;
            font-family: monospace;
            font-size: 11px;
        }
        .action-box {
            display: flex;
            gap: 5px;
            margin-top: 8px;
            align-items: center;
        }
        select, button {
            padding: 6px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }
        select {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
        }
        .btn-add { background: #10b981; color: white; }
        .btn-sub { background: #ef4444; color: white; }
        .btn-add:hover { background: #059669; }
        .btn-sub:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <h2>T-HUB Admin Panel (Quản lý thiết bị)</h2>
        <div id="adminList">Đang tải danh sách thiết bị...</div>
    </div>

    <script>
        const channel = new BroadcastChannel('thub_sync_channel');

        function loadAdmin() {
            let container = document.getElementById("adminList");
            let usersData = JSON.parse(localStorage.getItem("thub_users_db") || "{}");
            let keys = Object.keys(usersData);

            if (keys.length === 0) {
                container.innerHTML = "<div style='text-align:center; color:#64748b; padding:20px;'>Chưa có thiết bị nào kết nối.</div>";
                return;
            }

            let html = "";
            let now = Date.now();

            keys.forEach(hwid => {
                let user = usersData[hwid];
                let timeLeft = user.expire - now;
                let isExpired = timeLeft <= 0;

                let timeStr = "";
                if (isExpired) {
                    timeStr = "<span style='color:#ef4444'>0 Giờ (Chưa kích hoạt)</span>";
                } else {
                    let h = Math.floor(timeLeft / (1000 * 60 * 60));
                    let m = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    let s = Math.floor((timeLeft % (1000 * 60)) / 1000);
                    timeStr = `<span style='color:#10b981'>Còn lại: ${h}h ${m}m ${s}s</span>`;
                }

                html += `
                    <div class="device-item">
                        <div><b>HWID:</b> ${hwid}</div>
                        <div><b>Trạng thái:</b> ${timeStr}</div>
                        <div class="action-box">
                            <select id="select_${hwid}">
                                <option value="1">+1 Giờ</option>
                                <option value="2">+2 Giờ</option>
                                <option value="5">+5 Giờ</option>
                                <option value="12">+12 Giờ</option>
                                <option value="24" selected>+24 Giờ</option>
                                <option value="48">+48 Giờ</option>
                                <option value="-1">-1 Giờ</option>
                                <option value="-24">-24 Giờ</option>
                            </select>
                            <button class="btn-add" onclick="applyTime('${hwid}')">Xác nhận</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function applyTime(hwid) {
            let selectEl = document.getElementById(`select_${hwid}`);
            let hours = parseInt(selectEl.value);

            let usersData = JSON.parse(localStorage.getItem("thub_users_db") || "{}");
            if (usersData[hwid]) {
                let now = Date.now();
                let base = usersData[hwid].expire > now ? usersData[hwid].expire : now;
                
                usersData[hwid].expire = base + (hours * 60 * 60 * 1000);
                if (usersData[hwid].expire < now) usersData[hwid].expire = now;

                localStorage.setItem("thub_users_db", JSON.stringify(usersData));
                
                // Gửi tín hiệu đồng bộ ngay lập tức sang trang người dùng
                channel.postMessage({ type: 'UPDATE_USERS', hwid: hwid });
                loadAdmin();
            }
        }

        // Tự động làm mới bảng Admin mỗi giây để số giây đếm lùi trực tiếp trên giao diện Admin luôn
        channel.onmessage = function (event) {
            if (event.data && event.data.type === 'UPDATE_USERS') {
                loadAdmin();
            }
        };

        setInterval(loadAdmin, 1000);
        loadAdmin();
    </script>
</body>
</html>

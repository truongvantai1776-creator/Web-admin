<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-HUB | Admin Panel</title>
    <style>
        body { background: #060913; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: rgba(17, 24, 39, 0.9); padding: 20px; border-radius: 12px; border: 1px solid #38bdf8; }
        h2 { color: #38bdf8; text-align: center; }
        .form-group { margin-bottom: 15px; }
        input, button { padding: 10px; border-radius: 6px; border: 1px solid #38bdf8; background: #0b1329; color: #fff; font-size: 14px; }
        button { background: #38bdf8; color: #060913; font-weight: bold; cursor: pointer; }
        button:hover { background: #0ea5e9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #1e293b; padding: 10px; text-align: left; font-size: 13px; }
        th { background: #0b1329; color: #38bdf8; }
        .actions button { padding: 5px 8px; font-size: 12px; margin-right: 5px; }
        .danger { background: #ef4444 !important; border-color: #ef4444 !important; color: #fff !important; }
    </style>
</head>
<body>
<div class="container">
    <h2>T-HUB Admin Dashboard</h2>
    
    <div class="form-group">
        <h3>Tạo Key Mới Thủ Công</h3>
        <input type="text" id="customKey" placeholder="Nhập tên key tùy chỉnh...">
        <input type="number" id="hoursValid" placeholder="Số giờ hiệu lực (VD: 24)" value="24">
        <button onclick="createNewKey()">Tạo Key</button>
        <button onclick="loadData()" style="background:#10b981; color:#fff;">Làm Mới Danh Sách</button>
    </div>

    <h3>Danh Sách Key Hiện Tại (<span id="totalKeys">0</span>)</h3>
    <table>
        <thead>
            <tr>
                <th>Key</th>
                <th>Trạng Thái / Hạn Sử Dụng</th>
                <th>Thao Tác</th>
            </tr>
        </thead>
        <tbody id="keyList">
            <tr><td colspan="3" style="text-align: center;">Đang tải dữ liệu...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const NPOINT_URL = "https://api.npoint.io/cd54b4bf2ab3d1bcfa13";

    async function loadData() {
        let tbody = document.getElementById("keyList");
        tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">Đang tải dữ liệu...</td></tr>`;
        try {
            let res = await fetch(NPOINT_URL + "?t=" + Date.now());
            let data = await res.json();
            if (!data || !Array.isArray(data.devices)) data = { devices: [] };

            document.getElementById("totalKeys").innerText = data.devices.length;
            tbody.innerHTML = "";

            if (data.devices.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color:#94a3b8;">Không có key nào trên hệ thống.</td></tr>`;
                return;
            }

            let now = Date.now();
            data.devices.forEach((dev, index) => {
                let expireDate = new Date(dev.expireTimestamp).toLocaleString();
                let isExpired = dev.expireTimestamp <= now;
                let statusText = isExpired ? `<span style="color:#ef4444;">Đã hết hạn (${expireDate})</span>` : `<span style="color:#10b981;">Còn hạn (${expireDate})</span>`;

                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td style="font-family:monospace; color:#38bdf8;">${dev.key}</td>
                    <td>${statusText}</td>
                    <td class="actions">
                        <button onclick="extendKey(${index})">+24h</button>
                        <button class="danger" onclick="deleteKey(${index})">Xóa</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color:#ef4444;">Lỗi kết nối nPoint!</td></tr>`;
        }
    }

    async function createNewKey() {
        let keyVal = document.getElementById("customKey").value.trim();
        let hours = parseFloat(document.getElementById("hoursValid").value) || 24;
        if (!keyVal) { alert("Vui lòng nhập tên key!"); return; }

        let res = await fetch(NPOINT_URL + "?t=" + Date.now());
        let data = await res.json();
        if (!data || !Array.isArray(data.devices)) data = { devices: [] };

        data.devices.push({
            key: keyVal,
            expireTimestamp: Date.now() + (hours * 60 * 60 * 1000)
        });

        await fetch(NPOINT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        document.getElementById("customKey").value = "";
        alert("Tạo key thành công!");
        loadData();
    }

    async function extendKey(index) {
        let res = await fetch(NPOINT_URL + "?t=" + Date.now());
        let data = await res.json();
        if (data && data.devices && data.devices[index]) {
            // Cộng thêm 24 tiếng từ thời điểm hiện tại hoặc thời điểm cũ
            let baseTime = Math.max(data.devices[index].expireTimestamp, Date.now());
            data.devices[index].expireTimestamp = baseTime + (24 * 60 * 60 * 1000);

            await fetch(NPOINT_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            loadData();
        }
    }

    async function deleteKey(index) {
        if (!confirm("Bạn có chắc muốn xóa key này?")) return;
        let res = await fetch(NPOINT_URL + "?t=" + Date.now());
        let data = await res.json();
        if (data && data.devices) {
            data.devices.splice(index, 1);
            await fetch(NPOINT_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            loadData();
        }
    }

    loadData();
</script>
</body>
</html>

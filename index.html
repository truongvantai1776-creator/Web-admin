<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-HUB | Admin Panel</title>
    <style>
        body {
            background-color: #060913;
            background-image: radial-gradient(circle at center, #0f172a 0%, #060913 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            width: 480px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .header-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .logo-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        h2 { color: #38bdf8; margin: 0; font-size: 20px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        .subtitle { color: #94a3b8; font-size: 12px; }
        
        .stats-box {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            flex: 1;
            background: #0b0f19;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #1e293b;
        }
        .stat-card span { display: block; font-size: 18px; font-weight: bold; color: #38bdf8; margin-top: 4px; }

        .history-list {
            background: #0b0f19;
            padding: 12px;
            border-radius: 10px;
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid #1e293b;
            font-family: monospace;
            font-size: 11px;
        }
        .key-item {
            background: #111827;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #38bdf8;
            border: 1px solid #1e293b;
        }
        .key-item.expired {
            border-left-color: #ef4444;
            opacity: 0.65;
        }
        .key-string { color: #7dd3fc; word-break: break-all; margin: 4px 0; }
        .badge { font-weight: bold; }
        .badge-active { color: #10b981; }
        .badge-expired { color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <img src="logo.png" alt="T-HUB Logo" class="logo-img" onerror="this.src='https://i.imgur.com/6X93ZgV.png'">
            <div>
                <h2>T-HUB Admin Panel</h2>
                <div class="subtitle">Giám sát hệ thống Key trực tuyến (Cloud)</div>
            </div>
        </div>
        
        <div class="stats-box">
            <div class="stat-card">
                Tổng Key trên Cloud
                <span id="totalKeys">0</span>
            </div>
            <div class="stat-card">
                Đang hoạt động
                <span id="activeKeys" style="color: #10b981;">0</span>
            </div>
        </div>

        <div class="history-list" id="adminHistoryList">Đang tải dữ liệu từ Cloud...</div>
    </div>

    <script>
        const NPOINT_API_URL = "https://api.npoint.io/df2d5d0fda1ea4e5a0fa";

        async function loadAdminData() {
            let listContainer = document.getElementById("adminHistoryList");
            let now = Math.floor(Date.now() / 1000); // Thời gian hiện tại dạng giây (khớp với os.time())

            try {
                // Thêm { cache: "no-store" } để tránh trình duyệt lưu cache cũ, đảm bảo lấy dữ liệu mới nhất từ npoint
                let response = await fetch(NPOINT_API_URL, { cache: "no-store" });
                let data = await response.json();
                let keyHistory = data.keys || [];

                if (keyHistory.length === 0) {
                    listContainer.innerHTML = "<div style='text-align:center; color:#64748b; padding: 20px;'>Chưa có bản ghi nào trên hệ thống.</div>";
                    document.getElementById("totalKeys").innerText = "0";
                    document.getElementById("activeKeys").innerText = "0";
                    return;
                }

                let activeCount = 0;
                let html = "";

                // Đảo ngược để hiển thị key mới nhất lên đầu danh sách
                keyHistory.slice().reverse().forEach((item, index) => {
                    let expireTime = Number(item.expireTimestamp);
                    let timeLeft = expireTime - now;
                    let isExpired = timeLeft <= 0;
                    
                    if (!isExpired) activeCount++;

                    let timeStr = "";
                    if (isExpired) {
                        timeStr = "<span class='badge badge-expired'>[Đã hết hạn]</span>";
                    } else {
                        let hours = Math.floor(timeLeft / 3600);
                        let minutes = Math.floor((timeLeft % 3600) / 60);
                        let seconds = timeLeft % 60;
                        timeStr = `<span class='badge badge-active'>Còn lại: ${hours}h ${minutes}m ${seconds}s</span>`;
                    }

                    html += `
                        <div class="key-item ${isExpired ? 'expired' : ''}">
                            <div><b>#${keyHistory.length - index}</b> | ${timeStr}</div>
                            <div class="key-string">🔑 ${item.key}</div>
                            <div style="font-size:10px; color:#94a3b8;">HWID: ${item.hwid || 'Chưa kích hoạt'}</div>
                        </div>
                    `;
                });

                listContainer.innerHTML = html;
                document.getElementById("totalKeys").innerText = keyHistory.length;
                document.getElementById("activeKeys").innerText = activeCount;

            } catch (err) {
                listContainer.innerHTML = "<div style='text-align:center; color:#ef4444; padding: 20px;'>Lỗi kết nối tới Cloud API!</div>";
                console.error(err);
            }
        }

        // Tự động làm mới dữ liệu mỗi 2 giây để cập nhật thời gian thực từ người dùng khác gửi lên
        setInterval(loadAdminData, 2000);
        loadAdminData();
    </script>
</body>
</html>

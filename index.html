<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Key Logs</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #181818;
            padding: 30px;
            border-radius: 12px;
            width: 450px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #2a2a2a;
        }
        h2 { color: #ff5555; margin-bottom: 10px; font-size: 22px; text-align: center; }
        p { color: #aaa; font-size: 13px; margin-bottom: 15px; text-align: center; }
        .history-list {
            background: #121212;
            padding: 12px;
            border-radius: 6px;
            max-height: 280px;
            overflow-y: auto;
            border: 1px solid #222;
            color: #00ffcc;
            font-family: monospace;
            font-size: 11px;
        }
        .history-list div {
            padding: 8px 0;
            border-bottom: 1px solid #1a1a1a;
            word-break: break-all;
        }
        .clear-btn {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #ff5555;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .clear-btn:hover { background: #e04343; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Admin Panel</h2>
        <p>Lịch sử các chuỗi Key phức tạp đã cấp</p>
        
        <div class="history-list" id="adminHistoryList">Đang tải dữ liệu...</div>
        
        <button class="clear-btn" onclick="clearHistory()">XÓA SẠCH LỊCH SỬ</button>
    </div>

    <script>
        function loadAdminData() {
            let keyHistory = JSON.parse(localStorage.getItem("system_key_history") || "[]");
            let html = "";
            if (keyHistory.length === 0) {
                html = "Chưa có bản ghi nào.";
            } else {
                html = keyHistory.reverse().map((item, index) => 
                    `<div><b>[${item.time}]</b><br>${item.key}</div>`
                ).join('');
            }
            document.getElementById("adminHistoryList").innerHTML = html;
        }

        loadAdminData();

        function clearHistory() {
            if(confirm("Xóa sạch toàn bộ lịch sử key?")) {
                localStorage.removeItem("system_key_history");
                localStorage.removeItem("system_secure_session");
                loadAdminData();
                alert("Đã dọn sạch sẽ!");
            }
        }
    </script>

</body>
</html>

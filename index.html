<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-HUB | Admin Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap');
        
        body {
            background: #030712;
            background-image: radial-gradient(circle at 50% 20%, #0c2042 0%, #030712 90%);
            color: #fff;
            font-family: 'Inter', sans-serif;
            padding: 30px;
            min-height: 100vh;
        }

        .lang-switch {
            position: absolute;
            top: 25px;
            right: 35px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .lang-switch:hover {
            background: #38bdf8;
            color: #030712;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        .container {
            max-width: 950px;
            margin: 40px auto;
            background: rgba(11, 19, 43, 0.75);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(56, 189, 248, 0.1);
            backdrop-filter: blur(20px);
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            color: #38bdf8;
            text-align: center;
            font-size: 26px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            margin-bottom: 25px;
        }

        h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            color: #7dd3fc;
        }

        .form-box {
            background: rgba(3, 7, 18, 0.8);
            padding: 20px;
            border-radius: 12px;
            border: 1px dashed rgba(56, 189, 248, 0.4);
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        input {
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            background: rgba(6, 9, 19, 0.9);
            color: #fff;
            flex: 1;
            min-width: 160px;
            font-family: 'Inter', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: #38bdf8;
            color: #030712;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #7dd3fc;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid rgba(30, 41, 59, 0.8);
            padding: 14px;
            text-align: left;
            font-size: 13px;
        }

        th {
            background: rgba(3, 7, 18, 0.9);
            color: #38bdf8;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
        }

        .badge-unused {
            color: #10b981;
            font-weight: bold;
            background: rgba(16,185,129,0.1);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #10b981;
            font-size: 11px;
        }

        .actions button {
            padding: 6px 12px;
            font-size: 11px;
            margin-right: 5px;
        }

        .btn-danger {
            background: #ef4444 !important;
            color: #fff !important;
        }

        .btn-danger:hover {
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6) !important;
        }

        .btn-success {
            background: #10b981 !important;
            color: #fff !important;
        }

        .btn-success:hover {
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.6) !important;
        }
    </style>
</head>
<body>

    <button class="lang-switch" onclick="toggleLanguage()">🌐 EN / VI</button>

    <div class="container">
        <h2 id="mainHeading">T-HUB Admin Dashboard</h2>
        
        <div class="form-box">
            <h3 id="createTitle">Manual Key Generator</h3>
            <div class="form-group">
                <input type="text" id="customKey" placeholder="Enter custom key (e.g., THUB_VIP)...">
                <input type="number" id="hoursValid" placeholder="Hours (e.g., 24)" value="24">
                <button onclick="createNewKey()" id="createBtn">Create Key</button>
                <button class="btn-success" onclick="loadData()" id="refreshBtn">Refresh</button>
            </div>
        </div>

        <h3 id="listTitle">Active Keys Management (<span id="totalKeys">0</span>)</h3>
        <table>
            <thead>
                <tr>
                    <th id="thKey">Key String</th>
                    <th id="thStatus">Usage Status</th>
                    <th id="thTimer">Real-time Countdown</th>
                    <th id="thAction">Time Adjustment & Actions</th>
                </tr>
            </thead>
            <tbody id="keyList">
                <tr><td colspan="4" style="text-align: center;" id="loadingText">Loading data from server...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const NPOINT_URL = "https://api.npoint.io/cd54b4bf2ab3d1bcfa13";
        let globalDevices = [];
        let currentLang = "en";

        const adminTexts = {
            en: {
                heading: "T-HUB Admin Dashboard",
                createTitle: "Manual Key Generator",
                placeholderKey: "Enter custom key (e.g., THUB_VIP)...",
                placeholderHours: "Hours (e.g., 24)",
                createBtn: "Create Key",
                refreshBtn: "Refresh",
                listTitle: "Active Keys Management",
                thKey: "Key String",
                thStatus: "Usage Status",
                thTimer: "Real-time Countdown",
                thAction: "Time Adjustment & Actions",
                loading: "Loading data from server...",
                statusUnused: "Unused (Ready)",
                statusUsed: "Used (Activated)",
                updateBtn: "Update",
                deleteBtn: "Delete",
                expiredText: "EXPIRED",
                alertNoKey: "Please enter a key name!",
                alertValidHours: "Please enter valid hours!",
                successCreate: "Key created successfully!",
                successUpdate: "Time updated successfully!",
                confirmDelete: "Are you sure you want to delete this key?",
                errorLoad: "Connection error to nPoint!"
            },
            vi: {
                heading: "T-HUB Bảng Điều Khiển Admin",
                createTitle: "Tạo Key Thủ Công",
                placeholderKey: "Nhập tên key (VD: THUB_VIP)...",
                placeholderHours: "Số giờ (VD: 24)",
                createBtn: "Tạo Key",
                refreshBtn: "Làm Mới",
                listTitle: "Quản Lý Danh Sách Key",
                thKey: "Mã Key",
                thStatus: "Trạng Thái Sử Dụng",
                thTimer: "Đếm Ngược Thời Gian Thực",
                thAction: "Điều Chỉnh Giờ & Thao Tác",
                loading: "Đang tải dữ liệu từ máy chủ...",
                statusUnused: "Chưa Dùng (Sẵn Sàng)",
                statusUsed: "Đã Sử Dụng (Kích Hoạt)",
                updateBtn: "Cập Nhật",
                deleteBtn: "Xóa",
                expiredText: "ĐÃ HẾT HẠN",
                alertNoKey: "Vui lòng nhập tên key!",
                alertValidHours: "Vui lòng nhập số giờ hợp lệ!",
                successCreate: "Tạo key thành công!",
                successUpdate: "Cập nhật thời gian thành công!",
                confirmDelete: "Bạn có chắc muốn xóa key này?",
                errorLoad: "Lỗi kết nối nPoint!"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === "en" ? "vi" : "en";
            updateAdminTexts();
            renderTable();
        }

        function updateAdminTexts() {
            let t = adminTexts[currentLang];
            document.getElementById("mainHeading").innerText = t.heading;
            document.getElementById("createTitle").innerText = t.createTitle;
            document.getElementById("customKey").placeholder = t.placeholderKey;
            document.getElementById("hoursValid").placeholder = t.placeholderHours;
            document.getElementById("createBtn").innerText = t.createBtn;
            document.getElementById("refreshBtn").innerText = t.refreshBtn;
            document.getElementById("listTitle").innerText = t.listTitle + ` (${globalDevices.length})`;
            document.getElementById("thKey").innerText = t.thKey;
            document.getElementById("thStatus").innerText = t.thStatus;
            document.getElementById("thTimer").innerText = t.thTimer;
            document.getElementById("thAction").innerText = t.thAction;
        }

        async function loadData() {
            let t = adminTexts[currentLang];
            let tbody = document.getElementById("keyList");
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">${t.loading}</td></tr>`;
            try {
                let res = await fetch(NPOINT_URL + "?t=" + Date.now());
                let data = await res.json();
                if (!data || !Array.isArray(data.devices)) data = { devices: [] };
                globalDevices = data.devices;
                document.getElementById("totalKeys").innerText = globalDevices.length;
                renderTable();
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color:#ef4444;">${t.errorLoad}</td></tr>`;
            }
        }

        function renderTable() {
            let t = adminTexts[currentLang];
            let tbody = document.getElementById("keyList");
            tbody.innerHTML = "";
            if (globalDevices.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color:#94a3b8;">${currentLang === "en" ? "No keys on the system." : "Không có key nào trên hệ thống."}</td></tr>`;
                return;
            }
            let now = Date.now();
            globalDevices.forEach((dev, index) => {
                let distance = dev.expireTimestamp - now;
                let timeStr = "";
                let isExpired = distance <= 0;
                if (isExpired) {
                    timeStr = `<span style='color:#ef4444; font-weight:bold;'>${t.expiredText}</span>`;
                } else {
                    let h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    let m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    let s = Math.floor((distance % (1000 * 60)) / 1000);
                    timeStr = `${h}h ${m}m ${s}s`;
                }
                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td style="font-family:'Orbitron',monospace; color:#38bdf8; font-weight:bold;">${dev.key}</td>
                    <td><span class="badge-unused">${t.statusUnused}</span></td>
                    <td style="font-family:'Orbitron',monospace; font-weight:bold; color:#f59e0b;" id="timer_${index}">${timeStr}</td>
                    <td class="actions">
                        <input type="number" id="add_hours_${index}" placeholder="+h" style="width:55px; padding:6px;" value="24">
                        <button class="btn-success" onclick="adjustTime(${index})">${t.updateBtn}</button>
                        <button class="btn-danger" onclick="deleteKey(${index})">${t.deleteBtn}</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        setInterval(() => {
            if (globalDevices.length > 0) {
                let t = adminTexts[currentLang];
                let now = Date.now();
                globalDevices.forEach((dev, index) => {
                    let timerEl = document.getElementById(`timer_${index}`);
                    if (timerEl) {
                        let distance = dev.expireTimestamp - now;
                        if (distance <= 0) {
                            timerEl.innerHTML = `<span style='color:#ef4444; font-weight:bold;'>${t.expiredText}</span>`;
                        } else {
                            let h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            let m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                            let s = Math.floor((distance % (1000 * 60)) / 1000);
                            timerEl.innerText = `${h}h ${m}m ${s}s`;
                        }
                    }
                });
            }
        }, 1000);

        async function createNewKey() {
            let t = adminTexts[currentLang];
            let keyVal = document.getElementById("customKey").value.trim();
            let hours = parseFloat(document.getElementById("hoursValid").value) || 24;
            if (!keyVal) {
                alert(t.alertNoKey);
                return;
            }
            globalDevices.push({ key: keyVal, expireTimestamp: Date.now() + (hours * 60 * 60 * 1000) });
            await saveToServer();
            document.getElementById("customKey").value = "";
            alert(t.successCreate);
        }

        async function adjustTime(index) {
            let t = adminTexts[currentLang];
            let inputVal = document.getElementById(`add_hours_${index}`).value;
            let hoursToAdd = parseFloat(inputVal);
            if (isNaN(hoursToAdd)) {
                alert(t.alertValidHours);
                return;
            }
            let baseTime = Math.max(globalDevices[index].expireTimestamp, Date.now());
            globalDevices[index].expireTimestamp = baseTime + (hoursToAdd * 60 * 60 * 1000);
            await saveToServer();
            alert(t.successUpdate);
        }

        async function deleteKey(index) {
            let t = adminTexts[currentLang];
            if (!confirm(t.confirmDelete)) return;
            globalDevices.splice(index, 1);
            await saveToServer();
        }

        async function saveToServer() {
            try {
                await fetch(NPOINT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ devices: globalDevices })
                });
                loadData();
            } catch (e) {
                alert(adminTexts[currentLang].errorLoad);
            }
        }

        loadData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-HUB | Admin Panel</title>
    <style>
        body {
            background-color: #060913;
            background-image: radial-gradient(circle at center, #0f172a 0%, #060913 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            width: 520px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .header-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .logo-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        h2 { color: #38bdf8; margin: 0; font-size: 20px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        .subtitle { color: #94a3b8; font-size: 12px; }
        
        .stats-box {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            flex: 1;
            background: #0b0f19;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #1e293b;
        }
        .stat-card span { display: block; font-size: 18px; font-weight: bold; color: #38bdf8; margin-top: 4px; }

        .history-list {
            background: #0b0f19;
            padding: 12px;
            border-radius: 10px;
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid #1e293b;
            font-family: monospace;
            font-size: 11px;
        }
        .key-item {
            background: #111827;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #38bdf8;
            border: 1px solid #1e293b;
        }
        .key-item.expired {
            border-left-color: #ef4444;
            opacity: 0.75;
        }
        .key-string { color: #7dd3fc; word-break: break-all; margin: 4px 0; }
        .badge { font-weight: bold; }
        .badge-active { color: #10b981; }
        .badge-expired { color: #ef4444; }

        .action-group {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .action-group button {
            flex: 1;
            padding: 6px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-add { background: #10b981; color: white; }
        .btn-add:hover { background: #059669; }
        .btn-sub { background: #ef4444; color: white; }
        .btn-sub:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <img src="logo.png" alt="T-HUB Logo" class="logo-img" onerror="this.src='https://i.imgur.com/6X93ZgV.png'">
            <div>
